<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pink Minion with Falling Snow & Eye Tracking ❄️👀</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* หิมะตก */
    .snow-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .snowflake {
      position: absolute;
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: fall linear infinite;
      box-shadow: 0 0 5px rgba(255,255,255,0.8);
    }

    .snowflake:nth-child(1)  { width: 6px;  height: 6px;  left: 10%; animation-duration: 12s; animation-delay: -2s; }
    .snowflake:nth-child(2)  { width: 8px;  height: 8px;  left: 20%; animation-duration: 15s; animation-delay: -5s; }
    .snowflake:nth-child(3)  { width: 12px; height: 12px; left: 30%; animation-duration: 10s; animation-delay: -1s; }
    .snowflake:nth-child(4)  { width: 5px;  height: 5px;  left: 40%; animation-duration: 18s; animation-delay: -8s; }
    .snowflake:nth-child(5)  { width: 9px;  height: 9px;  left: 50%; animation-duration: 14s; animation-delay: -3s; }
    .snowflake:nth-child(6)  { width: 7px;  height: 7px;  left: 60%; animation-duration: 13s; animation-delay: -6s; }
    .snowflake:nth-child(7)  { width: 11px; height: 11px; left: 70%; animation-duration: 11s; animation-delay: -4s; }
    .snowflake:nth-child(8)  { width: 6px;  height: 6px;  left: 80%; animation-duration: 16s; animation-delay: -7s; }
    .snowflake:nth-child(9)  { width: 10px; height: 10px; left: 90%; animation-duration: 17s; animation-delay: -9s; }
    .snowflake:nth-child(10) { width: 8px;  height: 8px;  left: 15%; animation-duration: 12s; animation-delay: -10s; }

    @keyframes fall {
      0%   { transform: translateY(-120vh) translateX(0) rotate(0deg); opacity: 0.9; }
      100% { transform: translateY(120vh) translateX(60px) rotate(720deg); opacity: 0; }
    }

    /* มินเนี่ยน */
    .minion {
      position: relative;
      width: 220px;
      height: 280px;
      z-index: 2;
    }

    .head {
      width: 180px;
      height: 180px;
      background: #ff99cc;
      border-radius: 50%;
      position: absolute;
      top: 0;
      left: 20px;
      border: 8px solid #333;
      box-shadow: inset 0 15px 30px rgba(0,0,0,0.15);
    }

    .eye {
      position: absolute;
      background: white;
      border: 7px solid #333;
      border-radius: 50%;
      box-shadow: inset 0 8px 15px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .eye-left  { width: 68px; height: 78px; top: 45px; left: 35px; }
    .eye-right { width: 68px; height: 78px; top: 45px; right: 35px; }

    /* ลูกตาที่จะเคลื่อนไหว */
    .pupil {
      width: 32px;
      height: 38px;
      background: #333;
      border-radius: 50%;
      position: absolute;
      top: 18px;
      left: 18px;
      box-shadow: inset -6px -6px 0 #0008;
      transition: transform 0.12s ease-out;
    }

    .pupil::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      top: 6px;
      left: 10px;
    }

    .mouth {
      width: 90px;
      height: 45px;
      background: #ff3366;
      border: 7px solid #333;
      border-top: none;
      border-radius: 0 0 80px 80px;
      position: absolute;
      top: 110px;
      left: 65px;
      overflow: hidden;
    }
    .mouth::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 20px;
      background: #ff6699;
      top: -10px;
      left: 0;
      border-radius: 50%;
    }

    .body { /* เหมือนเดิม */ 
      width: 180px;
      height: 160px;
      background: #ff6699;
      border: 8px solid #333;
      border-radius: 50% 50% 40% 40%;
      position: absolute;
      top: 140px;
      left: 20px;
      z-index: -1;
    }

    .overalls, .strap, .button, .arm, .hand, .leg, .shoe {
      /* คงค่าดั้งเดิมไว้เหมือนโค้ดก่อนหน้า */
      /* ... (ตัดออกเพื่อความสั้น แต่ให้ copy ต่อจากโค้ดเดิมได้เลย) ... */
    }

    h1 {
      position: absolute;
      top: 30px;
      color: #ffccdd;
      text-shadow: 0 0 12px #ff99cc, 0 0 24px #ff3366;
      z-index: 3;
      font-size: 2.2rem;
    }
  </style>
</head>
<body>

  <h1>Pink Minion มองตามมือคุณ ❄️👀</h1>

  <!-- หิมะตก -->
  <div class="snow-container">
    <div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div>
    <div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div>
    <div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div>
    <div class="snowflake"></div>
  </div>

  <!-- มินเนี่ยน -->
  <div class="minion">
    <div class="head">
      <div class="eye eye-left">
        <div class="pupil" id="pupil-left"></div>
      </div>
      <div class="eye eye-right">
        <div class="pupil" id="pupil-right"></div>
      </div>
      <div class="mouth"></div>
    </div>

    <!-- ส่วนที่เหลือของ body, overalls, arms, legs, shoes เหมือนเดิม -->
    <!-- copy มาจากโค้ดก่อนหน้าได้เลย -->
    <div class="body">
      <div class="overalls">
        <div class="strap strap-left"></div>
        <div class="strap strap-right"></div>
        <div class="button button-left"></div>
        <div class="button button-right"></div>
      </div>
    </div>

    <div class="arm arm-left"><div class="hand"></div></div>
    <div class="arm arm-right"><div class="hand"></div></div>

    <div class="leg leg-left"><div class="shoe"></div></div>
    <div class="leg leg-right"><div class="shoe"></div></div>
  </div>

  <script>
    const pupilLeft  = document.getElementById('pupil-left');
    const pupilRight = document.getElementById('pupil-right');

    // ขนาดพื้นที่ที่ลูกตาเคลื่อนได้ (ประมาณครึ่งหนึ่งของรัศมีตา)
    const maxMove = 14; // px

    document.addEventListener('mousemove', (e) => {
      // หาตำแหน่งกึ่งกลางของแต่ละตาเทียบกับ viewport
      const leftEyeRect  = pupilLeft.parentElement.getBoundingClientRect();
      const rightEyeRect = pupilRight.parentElement.getBoundingClientRect();

      const leftCenterX  = leftEyeRect.left  + leftEyeRect.width  / 2;
      const leftCenterY  = leftEyeRect.top   + leftEyeRect.height / 2;

      const rightCenterX = rightEyeRect.left + rightEyeRect.width / 2;
      const rightCenterY = rightEyeRect.top  + rightEyeRect.height / 2;

      // คำนวณมุมจากเมาส์ไปยังจุดกึ่งกลางตา
      const deltaXLeft  = e.clientX - leftCenterX;
      const deltaYLeft  = e.clientY - leftCenterY;
      const angleLeft   = Math.atan2(deltaYLeft, deltaXLeft);

      const deltaXRight = e.clientX - rightCenterX;
      const deltaYRight = e.clientY - rightCenterY;
      const angleRight  = Math.atan2(deltaYRight, deltaXRight);

      // เคลื่อนลูกตาตามทิศทาง (แต่จำกัดระยะ)
      const moveXLeft = Math.cos(angleLeft) * maxMove;
      const moveYLeft = Math.sin(angleLeft) * maxMove;

      const moveXRight = Math.cos(angleRight) * maxMove;
      const moveYRight = Math.sin(angleRight) * maxMove;

      pupilLeft.style.transform  = `translate(${moveXLeft}px, ${moveYLeft}px)`;
      pupilRight.style.transform = `translate(${moveXRight}px, ${moveYRight}px)`;
    });
  </script>

</body>
</html>
